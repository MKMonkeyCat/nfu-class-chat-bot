apiVersion: v1
kind: Namespace
metadata:
  name: class-chat-bot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: class-chat-bot-sa
  namespace: class-chat-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: class-chat-bot-lease-role
  namespace: class-chat-bot
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: class-chat-bot-lease-binding
  namespace: class-chat-bot
subjects:
  - kind: ServiceAccount
    name: class-chat-bot-sa
    namespace: class-chat-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: class-chat-bot-lease-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: class-chat-bot
  namespace: class-chat-bot
  labels:
    app: class-chat-bot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: class-chat-bot
  template:
    metadata:
      labels:
        app: class-chat-bot
    spec:
      serviceAccountName: class-chat-bot-sa
      containers:
        - name: class-chat-bot
          image: ghcr.io/mkmonkeycat/nfu-class-chat-bot:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: class-chat-bot-secret
                  key: DISCORD_TOKEN
            - name: K8S_LEADER_ELECTION
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_LEASE_NAME
              value: class-chat-bot-discord
            - name: LEADER_ELECTION_LEASE_SECONDS
              value: "15"
          volumeMounts:
            - name: app-config
              mountPath: /app/config.toml
              readOnly: true
              subPath: config.toml
      volumes:
        - name: app-config
          configMap:
            name: class-chat-bot-config
            items:
              - key: config.toml
                path: config.toml
---
apiVersion: v1
kind: Service
metadata:
  name: class-chat-bot
  namespace: class-chat-bot
  labels:
    app: class-chat-bot
spec:
  selector:
    app: class-chat-bot
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
