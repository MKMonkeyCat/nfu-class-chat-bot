replicaCount: 1

image:
  repository: ghcr.io/mkmonkeycat/nfu-class-chat-bot
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080

env: []

discordToken:
  existingSecret: ""
  secretKey: DISCORD_TOKEN

persistence:
  config:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 512Mi
    mountPath: /app/config
  data:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /app/data

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
