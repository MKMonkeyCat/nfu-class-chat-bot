[package]
name = "class-chat-bot"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  ".",
  "crates/utils",
  "crates/entity",
  "crates/migration",
  "crates/config",
]

[dependencies]
utils = { path = "./crates/utils" }
entity = { path = "./crates/entity" }
migration = { path = "./crates/migration" }
config = { path = "./crates/config" }

dotenv = "0.15.0"
serde = "1.0.228"
serde_json = "1.0.145"

serenity = { version = "0.12", default-features = false, features = [
  "builder",
  "cache",
  "client",
  "gateway",
  "http",
  "model",
  "rustls_backend",
] }
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
reqwest = { version = "0.12.23", default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
] }
chrono = { version = "0.4.42", default-features = true }
sea-orm = { version = "2.0.0-rc", features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
] }

kube = { version = "0.98.0", default-features = false, features = [
  "client",
  "rustls-tls",
] }
k8s-openapi = { version = "0.24.0", features = ["v1_30"] }

scraper = "0.25.0"
url = "2.5.7"
cron = "0.15.0"

ahash = "0.8"
rand = "0.8"
jieba-rs = { version = "0.8", features = ["tfidf", "textrank"] }

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# panic = "abort"
